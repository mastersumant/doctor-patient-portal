# Netlify settings for ClinicDesk: static frontend + one serverless API function.
#
# Set these in Netlify → Site configuration → Environment variables (never commit them):
#   VITE_CLERK_PUBLISHABLE_KEY   pk_… (used when building the frontend)
#   CLERK_SECRET_KEY             sk_… (used only by the API function)
#   DATABASE_URL                 Supabase "Transaction pooler" connection string (port 6543)
# Optional: CLERK_AUTHORIZED_PARTIES (comma-separated site origins), CLERK_JWT_KEY.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Store records on the server (Netlify Function + Supabase) instead of in each browser.
  VITE_STORAGE_TYPE = "API"

[functions]
  directory = "netlify/functions"

# Single-page app: serve index.html for every other path so deep links and refreshes work.
# (/api/* is handled by the function before this rule applies.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
